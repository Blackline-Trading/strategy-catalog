name: CI

# The catalog is a hard dependency of BOTH tastytrade-bot and trading-platform
# (pinned by tag in their requirements.txt), but it had no CI at all — so its
# contract tests never ran and v0.4.0/v0.5.0 shipped with 4 failing tests that
# nobody saw until the 2026-08-06 audit. Every push and PR now runs them.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 3.11 matches the runtime both consumers deploy on (their Dockerfiles).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff==0.15.11

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest -q

      # A tagged release must match __version__ — the consumers pin by tag,
      # so a tag/version mismatch silently ships the wrong catalog.
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(python -c "import strategy_catalog; print(strategy_catalog.__version__)")
          echo "tag=$TAG version=$VER"
          test "$TAG" = "$VER"
